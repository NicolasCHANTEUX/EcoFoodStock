name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  supabase-integration:
    name: Supabase integration
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.107.0

      - name: Start Supabase
        run: supabase start

      - name: Reset database with migrations
        run: supabase db reset

      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o env > supabase.env

          value() {
            grep "^$1=" supabase.env | head -n 1 | cut -d= -f2- | sed 's/^"//;s/"$//'
          }

          api_url="$(value API_URL)"
          if [ -z "$api_url" ]; then
            api_url="$(value SUPABASE_URL)"
          fi
          if [ -z "$api_url" ]; then
            api_url="http://127.0.0.1:54321"
          fi

          anon_key="$(value ANON_KEY)"
          service_role_key="$(value SERVICE_ROLE_KEY)"

          if [ -z "$anon_key" ] || [ -z "$service_role_key" ]; then
            echo "Unable to read local Supabase keys from supabase status -o env" >&2
            exit 1
          fi

          {
            echo "SUPABASE_INTEGRATION_URL=$api_url"
            echo "SUPABASE_INTEGRATION_ANON_KEY=$anon_key"
            echo "SUPABASE_INTEGRATION_SERVICE_ROLE_KEY=$service_role_key"
          } >> "$GITHUB_ENV"

      - name: Run Supabase integration tests
        run: npm run test:integration:supabase

      - name: Stop Supabase
        if: always()
        run: supabase stop
